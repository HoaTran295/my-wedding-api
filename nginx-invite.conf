# Xem trước link có tên khách trên Zalo / Messenger:
#   index.html?invite-name=...  ->  "Thân mời <tên> tham dự đám cưới Trần Hòa & Ánh Tuyết"
# Zalo/Messenger không chạy JavaScript, chỉ đọc og:title trong HTML, nên nginx chuyển
# riêng các link có invite-name sang wedding-api (GET /api/v1/wedding/invite-page)
# để API trả index.html đã sửa og:title. Link không có tên vẫn trả file tĩnh như cũ.
# Nếu wedding-api đang tắt, nginx tự trả index.html tĩnh (thiệp vẫn mở bình thường).

# ---- (1) Đặt trong khối http { ... }  (ví dụ /etc/nginx/conf.d/invite-map.conf) ----
map $args $has_invite_name {
    default 0;
    "~(^|&)invite-name=[^&]" 1;
}

# ---- (2) Đặt trong khối server { ... } của cuoi-hoa-tuyet.htsolution.top ----
location ~ ^/(index\.html)?$ {
    recursive_error_pages on;
    error_page 418 = @invite_page;
    if ($has_invite_name) { return 418; }
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

location @invite_page {
    rewrite ^ /api/v1/wedding/invite-page break;
    proxy_pass http://127.0.0.1:2711;          # wedding-api chạy cùng server, port 2711
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @invite_static;
}

location @invite_static {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}
